name: Release Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_OUTPUT: release-evidence.json
        run: node scripts/ci/release-evidence.mjs "${{ inputs.candidate_sha }}"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.candidate_sha }}
          path: release-evidence.json
          if-no-files-found: warn
