name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runner_probe_slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: echo "ubuntu-slim runner acquired"

  runner_probe_2204:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: echo "ubuntu-22.04 runner acquired"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
