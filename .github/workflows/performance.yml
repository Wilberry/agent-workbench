name: Performance Benchmarks

on:
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BASE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install
      - run: sudo apt-get update && sudo apt-get install -y gnupg2 curl
      - run: curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
      - run: echo 'deb https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
      - run: sudo apt-get update && sudo apt-get install -y k6
      - run: pnpm test:performance
      - uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: tests/performance
