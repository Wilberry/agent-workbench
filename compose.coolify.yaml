services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.50"
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_signal: SIGTERM
    stop_grace_period: 300s
    environment:
      NODE_ENV: production
      AGENT_WORKBENCH_WORKER_NOT_BEFORE: ${AGENT_WORKBENCH_WORKER_NOT_BEFORE:?Set a deliberate queue cutoff}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the target Supabase URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the target Supabase service-role key}
      USE_MOCK_OPENAI: ${USE_MOCK_OPENAI:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
